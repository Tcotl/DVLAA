# DVLAA 统一入口网关
#
# 全部 AWDP 真实漏洞环境只通过 5080 端口暴露，按 Host 头（虚拟主机）路由：
#   localhost / 127.0.0.1 / dvlaa.localhost  → DVLAA 控制台（Flask）
#   awdpNN.localhost:5080                    → 对应题目的真实漏洞应用容器
#
# 浏览器可直接解析 *.localhost 到 127.0.0.1；后端容器全部接入 dvlaa-net，
# 不再向宿主机发布任何端口。

resolver 127.0.0.11 valid=10s ipv6=off;

# 真实环境不可用时回退到 native 模拟目标，按访问的虚拟主机定位题目。
map $host $native_challenge_root {
    awdp02.localhost /challenge/2;
    awdp03.localhost /challenge/3;
    awdp04.localhost /challenge/4;
    awdp05.localhost /challenge/5;
    awdp06.localhost /challenge/6;
    awdp07.localhost /challenge/7;
    awdp08.localhost /challenge/8;
    awdp09.localhost /challenge/9;
    awdp10.localhost /challenge/10;
    default /;
}

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
proxy_intercept_errors on;
client_max_body_size 200M;
# 上游返回的“内部绝对地址”（容器名或旧端口回环）改写为相对路径；
# 指向 awdpNN.localhost 等浏览器可达地址的重定向原样保留。
proxy_redirect ~^https?://(dvlaa-[A-Za-z0-9-]+|127\.0\.0\.1|172\.[0-9.]+)(?::\d+)?(/.*)$ $2;

# ── DVLAA 控制台（默认站点） ─────────────────────────────
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 dvlaa.localhost;
    # AWDP 模拟目标统一使用专属路径，避免与 OWASP /challenge/<level>/<sub> 冲突。
    # 页面：/awdp-target/<id>；产品 API：/awdp-target/<id>/api/... 或 /v1/...
    location ~ ^/awdp-target/[0-9]+/?(?:/(?:api|v1)(?:/.*)?)?$ {
        set $upstream_native_public http://dvlaa-awdp-native:5900;
        proxy_pass $upstream_native_public;
    }
    location / {
        set $upstream_dvlaa_console_5000 http://dvlaa-console:5000;
        proxy_pass $upstream_dvlaa_console_5000;
    }
}

# ── AWDP02 / 06 / 08：真实 Dify 1.9.2 ────────────────────
server {
    listen 80;
    server_name awdp02.localhost awdp06.localhost awdp08.localhost;
    location / {
        set $upstream_dvlaa_dify_nginx_1_80 http://dvlaa-dify-nginx-1:80;
        proxy_pass $upstream_dvlaa_dify_nginx_1_80;
        error_page 502 503 504 = @native_fallback;
    }
    location @native_fallback {
        set $up_native_fallback http://dvlaa-awdp-native:5900;
        if ($uri !~ ^/challenge/) { rewrite ^/(.*)$ $native_challenge_root/$1 break; }
        proxy_pass $up_native_fallback;
    }
}

