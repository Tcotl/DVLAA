{# 工单台：队列计数 + 工单表格 + 助手 #}
<style>
.tk-q{display:flex;gap:10px}
.tk-q .q{flex:1;border:1px solid var(--lab-line);border-radius:9px;padding:10px;text-align:center;background:#0d1626}
.tk-q .q b{display:block;font-size:20px;color:#fff}
.tk-q .q span{font-size:11px;color:var(--lab-dim)}
table.tk{width:100%;border-collapse:collapse;font-size:12.5px}
table.tk th{color:var(--lab-dim);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--lab-line);font-size:11.5px}
table.tk td{padding:9px 10px;border-bottom:1px solid var(--lab-line);color:#c9d7e8}
.tk-prio{padding:2px 8px;border-radius:10px;font-size:11px;background:#16233a;color:#aebfd6}
</style>
<div class="lab-grid2" style="grid-template-columns:1.4fr 1fr;">
    <div style="display:flex;flex-direction:column;gap:14px;">
        <section class="lab-card"><div class="lab-card-head"><span>工单队列</span><span class="sub">{{ theme.title }}</span></div>
            <div style="padding:14px;">
                <div class="tk-q">
                    {% for q in theme.props.queues %}<div class="q"><b>{{ q[1] }}</b><span>{{ q[0] }}</span></div>{% endfor %}
                </div>
            </div>
        </section>
        <section class="lab-card" style="flex:1;"><div class="lab-card-head"><span>工单列表</span></div>
            <div style="padding:6px 10px 12px;overflow:auto;">
                <table class="tk"><thead><tr><th>编号</th><th>客户 / 通道</th><th>主题</th><th>状态</th></tr></thead>
                <tbody>{% for t in theme.props.tickets %}<tr><td style="color:#7aa2f7">{{ t[0] }}</td><td>{{ t[1] }}</td><td>{{ t[2] }}</td><td><span class="tk-prio">{{ t[3] }}</span></td></tr>{% endfor %}</tbody></table>
            </div>
        </section>
    </div>
    {% include 'labs/_chat.html' %}
</div>
