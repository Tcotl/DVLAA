{# 邮件客户端：文件夹 + 邮件列表 + 助手侧栏 #}
<style>
.mail-wrap{display:grid;grid-template-columns:170px minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.mail-folder{padding:8px 10px;border-radius:7px;color:#b9c9dd;font-size:12.5px}
.mail-folder.active{background:color-mix(in srgb,var(--lab-accent) 20%,transparent);color:#fff}
.mail-item{padding:10px 12px;border-bottom:1px solid var(--lab-line);cursor:default}
.mail-item .from{color:#fff;font-size:12.5px;font-weight:600}.mail-item .subj{font-size:12px;margin-top:2px}.mail-item .time{color:var(--lab-dim);font-size:11px}
</style>
<div class="mail-wrap">
    <section class="lab-card"><div class="lab-card-head"><span>邮箱</span></div>
        <div style="padding:8px;">
            {% for f in theme.props.folders %}<div class="mail-folder {% if loop.first %}active{% endif %}">{{ f }}</div>{% endfor %}
        </div>
    </section>
    <section class="lab-card"><div class="lab-card-head"><span>邮件列表</span><span class="sub">{{ theme.title }}</span></div>
        <div style="overflow:auto;">
            {% for time, sender, subj, preview in theme.props.messages %}
            <div class="mail-item">
                <div style="display:flex;justify-content:space-between;"><span class="from">{{ sender }}</span><span class="time">{{ time }}</span></div>
                <div class="subj">{{ subj }}</div>
                <div style="color:var(--lab-dim);font-size:11.5px;">{{ preview }}</div>
            </div>
            {% endfor %}
        </div>
    </section>
    {% include 'labs/_chat.html' %}
</div>
