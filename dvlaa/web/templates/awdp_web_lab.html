<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AWDP 独立业务环境</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f4f7fb;
            --lab-brand: #1769d1;
            --lab-brand-dark: #1258b0;
            --lab-soft: #edf5ff;
            --lab-line: #dbe3ef;
            --lab-muted: #66758b;
            --lab-ink: #1d2d46;
            --lab-surface: #ffffff;
            --lab-danger: #bb3e4b;
            --lab-success: #13764a;
        }
        * { box-sizing: border-box; }
        body { min-width: 320px; margin: 0; background: #f4f7fb; }
        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: wait; opacity: 0.66; }
        .lab-shell { min-height: 650px; }
        .lab-shell[data-scenario="1"] { --lab-brand: #1769d1; --lab-brand-dark: #0d4d9a; --lab-soft: #eaf3ff; }
        .lab-shell[data-scenario="2"] { --lab-brand: #7b51b7; --lab-brand-dark: #5d378e; --lab-soft: #f4efff; }
        .lab-shell[data-scenario="3"] { --lab-brand: #1b8067; --lab-brand-dark: #126451; --lab-soft: #e7f7f1; }
        .lab-shell[data-scenario="4"] { --lab-brand: #b56116; --lab-brand-dark: #8e470d; --lab-soft: #fff3e5; }
        .lab-shell[data-scenario="5"] { --lab-brand: #0d7890; --lab-brand-dark: #075c70; --lab-soft: #e7f8fb; }
        .lab-shell[data-scenario="6"] { --lab-brand: #7756b8; --lab-brand-dark: #583b93; --lab-soft: #f1edfc; }
        .lab-shell[data-scenario="7"] { --lab-brand: #317a54; --lab-brand-dark: #23613f; --lab-soft: #edf8f0; }
        .lab-shell[data-scenario="8"] { --lab-brand: #986326; --lab-brand-dark: #754717; --lab-soft: #fbf3e8; }
        .lab-shell[data-scenario="9"] { --lab-brand: #39689e; --lab-brand-dark: #294e7b; --lab-soft: #edf3fb; }
        .lab-shell[data-scenario="10"] { --lab-brand: #a34a39; --lab-brand-dark: #813528; --lab-soft: #fceeea; }
        .lab-topbar { display: flex; min-height: 58px; align-items: center; gap: 1rem; padding: 0.7rem 1rem; border-bottom: 1px solid var(--lab-line); background: #fff; }
        .lab-brand { display: flex; min-width: 0; flex: 1; align-items: center; gap: 0.7rem; }
        .lab-brand-mark { display: grid; width: 30px; height: 30px; flex: 0 0 auto; border-radius: 6px; place-items: center; color: #fff; background: var(--lab-brand); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.04em; }
        .lab-brand-copy { display: grid; min-width: 0; gap: 0.1rem; }
        .lab-brand-copy strong, .lab-brand-copy small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lab-brand-copy strong { color: #16243a; font-size: 0.82rem; }
        .lab-brand-copy small { color: #6b7a91; font-size: 0.65rem; }
        .lab-env-badge { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 0.35rem; padding: 0.35rem 0.5rem; border: 1px solid color-mix(in srgb, var(--lab-brand) 30%, #fff); border-radius: 4px; color: var(--lab-brand); background: var(--lab-soft); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.62rem; font-weight: 700; }
        .lab-env-badge::before { width: 0.42rem; height: 0.42rem; border-radius: 50%; background: #1d9a5c; content: ""; }
        .lab-layout { display: grid; grid-template-columns: 174px minmax(0, 1fr); min-height: 592px; }
        .lab-nav { padding: 0.75rem 0.5rem; border-right: 1px solid var(--lab-line); background: #fbfcfe; }
        .lab-nav-label { display: block; padding: 0 0.48rem 0.45rem; color: #8a97aa; font-size: 0.58rem; font-weight: 800; letter-spacing: 0.07em; }
        .lab-nav-item { display: flex; width: 100%; align-items: center; gap: 0.5rem; margin: 0.13rem 0; padding: 0.48rem; border: 0; border-radius: 4px; color: #5d6c82; background: transparent; text-align: left; font-size: 0.68rem; }
        .lab-nav-item::before { width: 0.37rem; height: 0.37rem; border: 1px solid #aab6c7; border-radius: 50%; content: ""; }
        .lab-nav-item.active { color: var(--lab-brand-dark); background: var(--lab-soft); font-weight: 700; }
        .lab-nav-item.active::before { border-color: var(--lab-brand); background: var(--lab-brand); }
        .lab-main { min-width: 0; padding: 1rem; }
        .lab-page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.8rem; margin-bottom: 0.85rem; }
        .lab-page-heading h1 { margin: 0; color: #16243a; font-size: 1.05rem; line-height: 1.25; }
        .lab-page-heading p { margin: 0.28rem 0 0; color: #6b7a91; font-size: 0.68rem; }
        .lab-patch-state { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 0.36rem; padding: 0.36rem 0.52rem; border: 1px solid #e8c87f; border-radius: 4px; color: #896210; background: #fff9e9; font-size: 0.62rem; font-weight: 700; }
        .lab-patch-state.safe { border-color: #9ed9b8; color: #167443; background: #effbf4; }
        .lab-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.58rem; margin-bottom: 0.85rem; }
        .lab-metric { padding: 0.62rem 0.7rem; border: 1px solid var(--lab-line); border-radius: 5px; background: #fff; }
        .lab-metric span { display: block; color: #8492a6; font-size: 0.58rem; }
        .lab-metric strong { display: block; overflow: hidden; margin-top: 0.28rem; color: #243550; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.68rem; text-overflow: ellipsis; white-space: nowrap; }
        .lab-business-surface { min-width: 0; }
        .business-shell { display: grid; gap: 0.7rem; }
        .business-banner { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.8rem; padding: 0.75rem 0.85rem; border: 1px solid color-mix(in srgb, var(--lab-brand) 25%, #fff); border-radius: 6px; color: var(--lab-brand-dark); background: var(--lab-soft); }
        .business-banner-copy { display: grid; gap: 0.22rem; }
        .business-banner-copy strong { color: var(--lab-brand-dark); font-size: 0.75rem; }
        .business-banner-copy span { color: #536b85; font-size: 0.64rem; line-height: 1.45; }
        .business-banner-meta { padding: 0.25rem 0.4rem; border: 1px solid color-mix(in srgb, var(--lab-brand) 32%, #fff); border-radius: 3px; color: var(--lab-brand-dark); background: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.57rem; font-weight: 700; white-space: nowrap; }
        .business-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.7rem; }
        .business-grid.wide-left { grid-template-columns: minmax(0, 1.25fr) minmax(240px, 0.75fr); }
        .business-grid.wide-right { grid-template-columns: minmax(240px, 0.72fr) minmax(0, 1.28fr); }
        .business-card { min-width: 0; border: 1px solid var(--lab-line); border-radius: 6px; background: var(--lab-surface); }
        .business-card-header { display: flex; align-items: center; justify-content: space-between; gap: 0.55rem; padding: 0.67rem 0.76rem; border-bottom: 1px solid #edf1f6; }
        .business-card-title { color: #263952; font-size: 0.72rem; font-weight: 750; }
        .business-card-note { color: #7b899e; font-size: 0.58rem; }
        .business-card-body { padding: 0.76rem; }
        .business-card-body > p { margin: 0; color: var(--lab-muted); font-size: 0.64rem; line-height: 1.5; }
        .business-tag { display: inline-flex; align-items: center; padding: 0.2rem 0.35rem; border: 1px solid color-mix(in srgb, var(--lab-brand) 30%, #fff); border-radius: 3px; color: var(--lab-brand-dark); background: var(--lab-soft); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.55rem; font-weight: 750; }
        .business-list { display: grid; gap: 0.4rem; margin: 0; padding: 0; list-style: none; }
        .business-list-item { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.48rem 0; border-bottom: 1px solid #eef2f7; color: #455873; font-size: 0.64rem; }
        .business-list-item:last-child { border-bottom: 0; }
        .business-list-item strong { color: #283d5a; font-size: 0.64rem; }
        .business-list-item span { color: #79889d; font-size: 0.6rem; text-align: right; }
        .business-fact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.45rem; }
        .business-fact { padding: 0.52rem; border: 1px solid #edf1f6; border-radius: 4px; background: #fbfcfe; }
        .business-fact span { display: block; color: #8592a3; font-size: 0.56rem; }
        .business-fact strong { display: block; overflow: hidden; margin-top: 0.2rem; color: #334965; font-size: 0.66rem; text-overflow: ellipsis; white-space: nowrap; }
        .business-stepper { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.3rem; }
        .business-step { position: relative; padding: 0.44rem 0.38rem 0.44rem 1.22rem; border: 1px solid #e5eaf1; border-radius: 4px; color: #617189; background: #fff; font-size: 0.59rem; }
        .business-step::before { position: absolute; top: 0.43rem; left: 0.42rem; display: grid; width: 0.5rem; height: 0.5rem; border-radius: 50%; place-items: center; color: #fff; background: var(--lab-brand); content: ""; }
        .business-step.active { border-color: color-mix(in srgb, var(--lab-brand) 36%, #fff); color: var(--lab-brand-dark); background: var(--lab-soft); font-weight: 700; }
        .business-node-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.45rem; }
        .business-node { padding: 0.58rem; border: 1px solid #e5eaf1; border-radius: 4px; background: #fff; }
        .business-node strong { display: block; color: #344b68; font-size: 0.64rem; }
        .business-node span { display: block; margin-top: 0.22rem; color: var(--lab-success); font-size: 0.58rem; }
        .business-node.restricted span { color: #9b671b; }
        .business-route-list { display: grid; overflow: hidden; border: 1px solid #e5eaf1; border-radius: 4px; }
        .business-route { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 0.45rem; padding: 0.48rem 0.55rem; border-bottom: 1px solid #edf1f6; color: #405775; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.58rem; }
        .business-route:last-child { border-bottom: 0; }
        .business-route strong { color: var(--lab-brand-dark); font-size: 0.55rem; }
        .business-route span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .business-route small { color: #75849a; font-family: inherit; font-size: 0.52rem; }
        .app-grid, .document-grid, .execution-grid { display: grid; gap: 0.45rem; }
        .app-item, .document-item, .execution-item { display: grid; gap: 0.2rem; padding: 0.58rem; border: 1px solid #e5eaf1; border-radius: 4px; background: #fff; }
        .app-item.private, .document-item.external, .execution-item.external { border-color: #efd2ca; background: #fffafa; }
        .app-item strong, .document-item strong, .execution-item strong { color: #344b68; font-size: 0.65rem; }
        .app-item span, .document-item span, .execution-item span { color: #738299; font-size: 0.58rem; line-height: 1.42; }
        .execution-item { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
        .execution-item > div { display: grid; gap: 0.2rem; }
        .sql-editor { min-height: 125px !important; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.55; }
        .lab-business-form { display: grid; gap: 0.56rem; }
        .lab-business-form.compact { gap: 0.44rem; }
        .lab-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
        .lab-form-grid.single { grid-template-columns: 1fr; }
        .lab-field { display: grid; gap: 0.26rem; min-width: 0; }
        .lab-field > span { color: #556680; font-size: 0.63rem; font-weight: 700; }
        .lab-field input, .lab-field select, .lab-field textarea { width: 100%; padding: 0.47rem 0.52rem; border: 1px solid #c9d6e6; border-radius: 4px; outline: none; color: #1e304a; background: #fff; font-size: 0.67rem; }
        .lab-field textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
        .lab-field input:focus, .lab-field select:focus, .lab-field textarea:focus { border-color: var(--lab-brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--lab-brand) 14%, transparent); }
        .lab-field.is-wide { grid-column: 1 / -1; }
        .lab-switch-field { display: flex; align-items: center; gap: 0.45rem; min-height: 34px; padding: 0.44rem 0.52rem; border: 1px solid #c9d6e6; border-radius: 4px; color: #50637e; font-size: 0.64rem; }
        .lab-switch-field input { width: auto; accent-color: var(--lab-brand); }
        .lab-submit { min-height: 34px; border: 1px solid var(--lab-brand); border-radius: 4px; color: #fff; background: var(--lab-brand); font-size: 0.67rem; font-weight: 750; }
        .lab-submit:hover { background: var(--lab-brand-dark); }
        .lab-secondary-action { min-height: 31px; padding: 0.42rem 0.55rem; border: 1px solid color-mix(in srgb, var(--lab-brand) 32%, #fff); border-radius: 4px; color: var(--lab-brand-dark); background: #fff; font-size: 0.63rem; font-weight: 700; }
        .lab-secondary-action:hover { background: var(--lab-soft); }
        .business-inline-actions { display: flex; flex-wrap: wrap; gap: 0.42rem; }
        .lab-response-panel { margin-top: 0.82rem; overflow: hidden; border: 1px solid var(--lab-line); border-radius: 6px; background: #fff; }
        .lab-response-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.65rem 0.76rem; border-bottom: 1px solid #edf1f6; }
        .lab-response-title { display: grid; gap: 0.12rem; }
        .lab-response-title strong { color: #283a57; font-size: 0.71rem; }
        .lab-response-title span { color: #8a97aa; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.56rem; }
        .lab-response-status { padding: 0.22rem 0.36rem; border: 1px solid #dbe3ef; border-radius: 3px; color: #74839a; background: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.58rem; font-weight: 700; }
        .lab-response-status.success { border-color: #9ed9b8; color: #167443; background: #effbf4; }
        .lab-response-status.failure { border-color: #e7abb0; color: #a3313e; background: #fff2f3; }
        .lab-response-body { display: grid; gap: 0.68rem; padding: 0.76rem; background: #fcfdff; }
        .lab-response-message { margin: 0; color: #3d516e; font-size: 0.67rem; line-height: 1.5; }
        .lab-response-data { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.45rem; }
        .result-field { min-width: 0; padding: 0.55rem; border: 1px solid #e2e9f2; border-radius: 4px; background: #fff; }
        .result-field > span { display: block; color: #8190a4; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.55rem; }
        .result-field > strong, .result-field > code { display: block; overflow: auto; margin-top: 0.24rem; color: #334a67; font-size: 0.64rem; font-weight: 650; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
        .result-field > code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
        .result-field.is-secret { border-color: #e9c58a; background: #fffaf0; }
        .result-field.is-secret > code { color: #8b5c10; }
        .result-list { display: grid; gap: 0.27rem; margin-top: 0.3rem; }
        .result-list-item { padding: 0.36rem 0.42rem; border-radius: 3px; color: #536984; background: #f5f8fc; font-size: 0.6rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
        .lab-response-diagnostics { margin: 0; padding-top: 0.18rem; border-top: 1px solid #edf1f6; }
        .lab-response-diagnostics summary { color: #718198; cursor: pointer; font-size: 0.59rem; }
        .lab-response-diagnostics pre { max-height: 230px; overflow: auto; margin: 0.45rem 0 0; padding: 0.62rem; border: 1px solid #e0e7f0; border-radius: 4px; color: #405775; background: #f6f8fb; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.6rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .lab-audit { margin-top: 0.82rem; overflow: hidden; border: 1px solid var(--lab-line); border-radius: 6px; background: #fff; }
        .lab-audit-header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.62rem 0.75rem; border-bottom: 1px solid var(--lab-line); }
        .lab-audit-header strong { color: #283a57; font-size: 0.71rem; }
        .lab-audit-header span { color: #8795a8; font-size: 0.6rem; }
        .lab-audit-table { width: 100%; border-collapse: collapse; font-size: 0.63rem; }
        .lab-audit-table th, .lab-audit-table td { padding: 0.5rem 0.7rem; border-bottom: 1px solid #eef2f7; text-align: left; }
        .lab-audit-table th { color: #8a97aa; background: #fbfcfe; font-size: 0.56rem; font-weight: 800; }
        .lab-audit-table td { color: #5d6c82; }
        .lab-audit-table tr:last-child td { border-bottom: 0; }
        .lab-empty { color: #96a3b4 !important; text-align: center; }
        @media (max-width: 740px) {
            .lab-layout { grid-template-columns: 1fr; }
            .lab-nav { display: flex; overflow-x: auto; padding: 0.4rem; border-right: 0; border-bottom: 1px solid var(--lab-line); }
            .lab-nav-label { display: none; }
            .lab-nav-item { width: auto; flex: 0 0 auto; white-space: nowrap; }
            .lab-main { padding: 0.75rem; }
            .lab-metrics, .business-grid, .business-grid.wide-left, .business-grid.wide-right { grid-template-columns: 1fr; }
            .lab-page-heading { display: grid; }
            .lab-response-data { grid-template-columns: 1fr; }
        }
        @media (max-width: 440px) {
            .lab-topbar { padding: 0.62rem 0.72rem; }
            .lab-env-badge { display: none; }
            .lab-metrics, .business-fact-grid, .business-node-grid, .business-stepper, .lab-form-grid { grid-template-columns: 1fr; }
            .business-banner { display: grid; }
        }
    </style>
</head>
<body>
    <div class="lab-shell" id="labShell">
        <header class="lab-topbar">
            <div class="lab-brand">
                <div class="lab-brand-mark" id="labMark">WEB</div>
                <div class="lab-brand-copy"><strong id="labProduct">正在加载业务服务</strong><small id="labProductSubtitle">独立实验环境</small></div>
            </div>
            <span class="lab-env-badge">LOCAL SESSION</span>
        </header>
        <div class="lab-layout">
            <nav class="lab-nav" id="labNavigation" aria-label="业务导航"></nav>
            <main class="lab-main">
                <div class="lab-page-heading">
                    <div><h1 id="labTitle">正在读取服务状态</h1><p id="labSubtitle">服务端将返回当前浏览器会话的独立业务数据。</p></div>
                    <span id="labPatchState" class="lab-patch-state">部署状态读取中</span>
                </div>
                <section class="lab-metrics" aria-label="服务状态">
                    <div class="lab-metric"><span>服务模式</span><strong id="labMode">ISOLATED</strong></div>
                    <div class="lab-metric"><span>当前角色</span><strong id="labRole">WEB USER</strong></div>
                    <div class="lab-metric"><span>可用业务操作</span><strong id="labActionCount">0 ACTIONS</strong></div>
                </section>
                <section id="labBusinessSurface" class="lab-business-surface" aria-label="业务应用界面">
                    <div id="labRequestForm" aria-live="polite"></div>
                </section>
                <section class="lab-response-panel" aria-label="业务响应">
                    <div class="lab-response-head">
                        <div class="lab-response-title"><strong>业务处理结果</strong><span id="labResponseEndpoint">/api/awdp-web</span></div>
                        <span id="labResponseStatus" class="lab-response-status">READY</span>
                    </div>
                    <div class="lab-response-body">
                        <p id="labResponseMessage" class="lab-response-message" aria-live="polite">请选择业务页面中的操作，结果会显示在这里。</p>
                        <div id="labResponseData" class="lab-response-data"></div>
                        <details class="lab-response-diagnostics">
                            <summary>查看本次服务响应诊断</summary>
                            <pre id="labResponseBody">{
  "message": "请选择业务页面中的操作。"
}</pre>
                        </details>
                    </div>
                </section>
                <section class="lab-audit" aria-label="服务审计轨迹">
                    <div class="lab-audit-header"><strong>服务审计轨迹</strong><span>仅显示本会话最近操作</span></div>
                    <table class="lab-audit-table"><thead><tr><th>操作</th><th>状态</th><th>服务说明</th></tr></thead><tbody id="labAuditRows"><tr><td class="lab-empty" colspan="3">正在加载审计记录...</td></tr></tbody></table>
                </section>
            </main>
        </div>
    </div>
    <script>
        window.DVLAA_AWDP_WEB = {
            id: {{ awdp_challenge.id|tojson }},
            apiBase: {{ ('/api/awdp-web/' ~ awdp_challenge.id)|tojson }}
        };
    </script>
    <script>
        (() => {
            const config = window.DVLAA_AWDP_WEB;
            const layouts = {
                1: { mark: "SS", nav: ["客服总览", "客户工单", "交接策略"], role: "GUEST", workspace: "客服服务台" },
                2: { mark: "MC", nav: ["迁移队列", "导入工单", "预览中心"], role: "MIGRATION USER", workspace: "迁移工作台" },
                3: { mark: "KB", nav: ["知识库", "文档导入", "检索中心"], role: "EDITOR", workspace: "知识库工作区" },

            function fieldControl(field, extraClass = "") {
                const wrapper = element("label", `lab-field ${extraClass}`.trim());
                const label = element("span", "", field.label);
                let control;
                if (field.type === "textarea") {
                    control = element("textarea");
                    control.rows = 3;
                    control.value = field.default || "";
                } else if (field.type === "boolean") {
                    const switcher = element("span", "lab-switch-field");
                    control = document.createElement("input");
                    control.type = "checkbox";
                    control.checked = truthy(field.default);
                    switcher.append(control, document.createTextNode("已启用"));
                    control.name = field.name;
                    append(wrapper, label, switcher);
                    return wrapper;
                } else {
                    control = document.createElement("input");
                    control.type = "text";
                    control.value = field.default || "";
                }
                control.name = field.name;
                append(wrapper, label, control);
                return wrapper;

            function actionForm(actionName, options = {}) {
                const action = actionByName(actionName);
                const form = element("form", `lab-business-form ${options.compact ? "compact" : ""}`.trim());
                form.noValidate = true;
                if (!action) {
                    form.append(element("p", "", "当前服务没有此业务操作。"));
                    return form;
                }
                const fieldGrid = element("div", `lab-form-grid${options.single ? " single" : ""}`);
                action.fields.forEach((field) => {
                    const displayField = options.defaults && Object.prototype.hasOwnProperty.call(options.defaults, field.name)
                        ? { ...field, default: options.defaults[field.name] }
                        : field;
                    const forceWide = field.type === "textarea" || (options.wideFields || []).includes(field.name);
                    const control = fieldControl(displayField, forceWide ? "is-wide" : "");
                    if (options.sql && field.name === "statement") {
                        const textArea = control.querySelector("textarea");
                        if (textArea) textArea.classList.add("sql-editor");
                    }
                    fieldGrid.append(control);
                });
                if (action.fields.length) form.append(fieldGrid);
                const submit = element("button", "lab-submit", options.submit || action.label);
                submit.type = "submit";
                form.append(submit);
                form.addEventListener("submit", (event) => {
                    event.preventDefault();
                    const payload = Object.fromEntries(new FormData(form).entries());
                    action.fields.filter((field) => field.type === "boolean").forEach((field) => {
                        if (!Object.prototype.hasOwnProperty.call(payload, field.name)) payload[field.name] = false;
                    });
                    executeAction(action.name, payload, submit);
                });
                return form;
            }

            function responseValue(value, key = "") {
                const field = element("div", `result-field${/flag|verifier|token|key/i.test(key) ? " is-secret" : ""}`);
                field.append(element("span", "", key || "result"));
                if (value === null || value === undefined) {
                    field.append(element("strong", "", "-"));
                    return field;
                }
                if (Array.isArray(value)) {
                    const listNode = element("div", "result-list");
                    value.forEach((item, index) => {
                        const itemNode = element("div", "result-list-item");
                        itemNode.textContent = typeof item === "object" ? stringify(item) : String(item);
                        itemNode.dataset.index = String(index);
                        listNode.append(itemNode);
                    });
                    field.append(listNode);
                    return field;
                }
                if (typeof value === "object") {
                    const listNode = element("div", "result-list");
                    Object.entries(value).forEach(([childKey, childValue]) => {
                        const itemNode = element("div", "result-list-item");
                        itemNode.textContent = `${childKey}: ${typeof childValue === "object" ? stringify(childValue) : String(childValue)}`;
                        listNode.append(itemNode);
                    });
                    field.append(listNode);
                    return field;
                }
                const text = /flag|verifier|token|key/i.test(key) ? element("code", "", String(value)) : element("strong", "", String(value));
                field.append(text);
                return field;
            }

            function renderResponse(response, failed = false) {
                lastResponse = response || null;
                lastResponseFailed = Boolean(failed);
                const body = byId("labResponseBody");
                const message = byId("labResponseMessage");
                const dataPanel = byId("labResponseData");
                const badge = byId("labResponseStatus");
                const endpoint = byId("labResponseEndpoint");
                if (!response) {
                    body.textContent = stringify({ message: "请选择业务页面中的操作。" });
                    message.textContent = "请选择业务页面中的操作，结果会显示在这里。";
                    dataPanel.replaceChildren();
                    badge.textContent = "READY";
                    badge.className = "lab-response-status";
                    endpoint.textContent = `${config.apiBase}/action`;
                    return;
                }
                const status = Number(response.status) || (failed ? 500 : 200);
                const normalized = {
                    status,
                    code: response.code || (failed ? "request_failed" : "ok"),
                    message: response.message || response.error || "服务已完成业务处理。",
                    data: response.data || {}
                };
                body.textContent = stringify(normalized);
                message.textContent = normalized.message;
                dataPanel.replaceChildren();
                const data = normalized.data && typeof normalized.data === "object" ? normalized.data : { result: normalized.data };
                const entries = Object.entries(data);
                if (entries.length === 0) dataPanel.append(responseValue("本次请求未返回额外业务字段。", "result"));
                else entries.forEach(([key, value]) => dataPanel.append(responseValue(value, key)));
                badge.textContent = failed ? `ERROR ${status}` : `HTTP ${status}`;
                badge.className = `lab-response-status ${failed || status >= 400 ? "failure" : "success"}`;
                endpoint.textContent = `${config.apiBase}/action/${response.action || "request"}`;
            }

            function renderBusinessSurface() {
                const mount = byId("labRequestForm");
                mount.replaceChildren();
                const factory = surfaceFactories[Number(config.id)];
                mount.append(factory ? factory() : genericFinalsSurface());
            }

            function renderLab(nextLab) {
                lab = nextLab || lab;
                if (!lab) return;
                byId("labShell").dataset.scenario = String(config.id);
                byId("labMark").textContent = layout.mark;
                byId("labProduct").textContent = lab.title || "业务服务";
                byId("labProductSubtitle").textContent = lab.subtitle || "独立实验环境";
                byId("labTitle").textContent = lab.title || "业务服务";
                byId("labSubtitle").textContent = lab.subtitle || "当前浏览器会话中的隔离业务环境";
                byId("labMode").textContent = lab.patched ? "PATCHED" : "VULNERABLE";
                byId("labRole").textContent = layout.role;
                byId("labActionCount").textContent = `${(lab.actions || []).length} OPERATIONS`;
                const patch = byId("labPatchState");
                patch.className = `lab-patch-state${lab.patched ? " safe" : ""}`;
                patch.textContent = lab.patched ? "修补已部署" : "易受攻击版本";
                renderNavigation();
                renderBusinessSurface();
                renderAudit(lab.audit);
                if (lastResponse) renderResponse(lastResponse, lastResponseFailed);
                else renderResponse(null);
            }

            async function executeAction(actionName, payload, button) {
                const action = actionByName(actionName);
                if (!action) return;
                const original = button && button.textContent;
                if (button) {
                    button.disabled = true;
                    button.textContent = "正在处理...";
                }
                try {
                    const result = await api(`/action/${encodeURIComponent(action.name)}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload || {})
                    });
                    const operation = result.result || result;
                    renderLab(result.lab || operation.lab || lab);
                    renderResponse({ ...operation, action: action.name });
                    const state = result.state || result.awdp_state || null;
                    const eventName = result.attack_solved === true || (state && state.attack_solved === true) ? "attack-solved" : "submission";
                    notify(eventName, { state, submissions: result.submissions || null });
                } catch (error) {
                    const response = error.data || { status: error.status || 500, error: error.message };
                    const operation = response.result || response;
                    renderLab(response.lab || operation.lab || lab);
                    renderResponse({ ...operation, action: action.name }, true);
                    notify("error", { message: error.message, state: response.state || null });
                } finally {
                    if (button && button.isConnected) {
                        button.disabled = false;
                        button.textContent = original || action.label;
                    }
                }
            }

            async function bootstrap() {
                try {
                    const result = await api("/bootstrap");
                    renderLab(result.lab || result);
                    notify("ready", { state: result.state || result.awdp_state || null, submissions: result.submissions || null });
                } catch (error) {
                    renderResponse(error.data || { status: error.status || 500, error: error.message }, true);
                    byId("labTitle").textContent = "目标服务暂不可用";
                    byId("labSubtitle").textContent = "请检查本题 Web 服务状态后重新加载。";
                    notify("error", { message: error.message });
                }
            }
            bootstrap();
        })();
    </script>
</body>
</html>
